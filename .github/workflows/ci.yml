# Verificação de todo Pull Request e de todo push na main.
# A proteção da main exige os dois jobs verdes antes do merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade (tipos, lint, regras, unitários, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:rules
      - name: Unitários e de componente, com cobertura mínima por arquivo
        run: npm run test:coverage
      - run: npm run build
      # Logo depois do build do app (o build:lib apaga dist/): o Motion fora do bundle inicial.
      - name: Vitrine sem o motor do Motion no bundle inicial
        run: npm run verify:bundle:app
      - run: npm run build:lib
      - name: Pacote sem import de motion fora do subcaminho motion
        run: npm run verify:bundle:lib
      - run: npm run verify:pack
      - name: Paletas em dia (rode npm run palettes:build e faça commit do palettes.css)
        run: npm run palettes:build -- --check
      - name: Registry em dia (rode npm run registry:build e faça commit do registry.json)
        run: |
          npm run registry:build
          git diff --exit-code registry.json
      - run: npm run build-storybook -- --quiet

  navegador:
    name: Navegador (layout, acessibilidade, visual)
    runs-on: ubuntu-latest
    # Mesma imagem usada para gerar as referências visuais: fontes e renderização idênticas.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Layout (rotas x larguras x modelos, claro e escuro)
        run: npm run test:layout
      - name: Acessibilidade (axe-core, WCAG 2.1 AA)
        if: ${{ !cancelled() }}
        run: npm run test:a11y
      - name: Regressão visual
        if: ${{ !cancelled() }}
        run: npm run test:visual
      - name: Fluxos de automação (arrastar, ligar, apagar, simular, tema e toque)
        if: ${{ !cancelled() }}
        run: npm run test:flow
      - name: Kanban (arrastar até o rodapé, confirmar e hint do calendário)
        if: ${{ !cancelled() }}
        run: npm run test:kanban
      - name: Automações (listagem, tela cheia, abas e histórico)
        if: ${{ !cancelled() }}
        run: npm run test:automacoes
      - name: CSS em camadas
        if: ${{ !cancelled() }}
        run: npm run test:css-layers
      - name: Página de apresentação e composição do site
        if: ${{ !cancelled() }}
        run: npm run test:site
      - name: Relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
